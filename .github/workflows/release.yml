name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Publish Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run all tests
        run: dotnet test -c Release --verbosity normal

      - name: Package Distribution (Self-Contained Windows x64)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.*)$') {
            $version = $Matches[1]
          } else {
            $version = "0.1.0-preview.1"
          }
          ./scripts/package.ps1 -Version $version -OutputDir "artifacts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: true
          generate_release_notes: true
