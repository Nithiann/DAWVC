name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0-preview.2)'
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build, Package & Publish Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run all tests
        run: dotnet test -c Release --verbosity normal

      - name: Determine Release Tag & Version
        id: tag_info
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag_name }}"
          $refName = "${{ github.ref_name }}"
          $isTag = "${{ startsWith(github.ref, 'refs/tags/') }}"
          
          if (-not [string]::IsNullOrWhiteSpace($inputTag)) {
            $tag = $inputTag
          } elseif ($isTag -eq "true") {
            $tag = $refName
          } else {
            Write-Error "Release tag not specified. Please supply tag_name in workflow_dispatch or trigger via a git tag."
            exit 1
          }
          
          if ($tag -match '^v(.*)$') {
            $version = $Matches[1]
          } else {
            $version = $tag
          }
          
          Write-Host "Determined Release Tag: $tag (Version: $version)"
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Package Distribution (Self-Contained Windows x64)
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Version $env:VERSION -OutputDir "artifacts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.TAG }}
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: true
          generate_release_notes: true


