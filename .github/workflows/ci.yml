name: CI

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main, develop, 'feat/**' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test-windows:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify code formatting
        run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic

      - name: Vulnerability & dependency security audit
        run: dotnet list package --vulnerable --include-transitive

      - name: Build solution (Release)
        run: dotnet build --no-restore -c Release

      - name: Package Windows x64 distribution
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Run all tests
        run: dotnet test --no-build -c Release --verbosity normal --logger "trx;LogFileName=test_results.trx"

      - name: Setup Python for release acceptance
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test acceptance harness guards
        run: python -m unittest discover -s scripts -p "test_preview_acceptance_guards.py"

      - name: Verify and exercise extracted Windows release
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem artifacts/dawvc-*-win-x64.zip)
          if ($archives.Count -ne 1) { throw "Expected exactly one release archive" }
          python scripts/test_preview_acceptance.py --archive ($archives[0].FullName) --checksums artifacts/SHA256SUMS.txt --report artifacts/preview-acceptance-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-acceptance-windows
          path: artifacts/preview-acceptance-windows.json
          if-no-files-found: warn
          retention-days: 14

  build-and-test-linux:
    name: Core, CLI & Protocol Integrity (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build full core solution
        run: dotnet build --no-restore -c Release

      - name: Run all tests including transient SSH protocol tests
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test_results.trx"

      - name: Setup Python for CLI acceptance
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test acceptance harness guards
        run: python -m unittest discover -s scripts -p "test_preview_acceptance_guards.py"

      - name: Exercise synthetic CLI collaboration workflow
        run: python scripts/test_preview_acceptance.py --dll src/DawVcs.Cli/bin/Release/net10.0/dawvc.dll --dotnet "$(command -v dotnet)" --report artifacts/preview-acceptance-linux.json

      - name: Upload Linux acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-acceptance-linux
          path: artifacts/preview-acceptance-linux.json
          if-no-files-found: warn
          retention-days: 14
