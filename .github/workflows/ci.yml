name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-windows:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify code formatting
        run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic

      - name: Build solution (Release)
        run: dotnet build --no-restore -c Release

      - name: Package Windows x64 distribution
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Run all tests
        run: dotnet test --no-build -c Release --verbosity normal --logger "trx;LogFileName=test_results.trx"

  build-and-test-linux:
    name: Core Domain & App Integrity (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Domain & Application
        run: |
          dotnet build src/DawVcs.Domain/DawVcs.Domain.csproj -c Release
          dotnet build src/DawVcs.Application/DawVcs.Application.csproj -c Release
          dotnet build tests/DawVcs.Domain.Tests/DawVcs.Domain.Tests.csproj -c Release
          dotnet build tests/DawVcs.Application.Tests/DawVcs.Application.Tests.csproj -c Release

      - name: Run Domain & Application Tests on Linux
        run: |
          dotnet test tests/DawVcs.Domain.Tests/DawVcs.Domain.Tests.csproj -c Release --no-build
          dotnet test tests/DawVcs.Application.Tests/DawVcs.Application.Tests.csproj -c Release --no-build
