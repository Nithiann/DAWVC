name: CI

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main, develop, 'feat/**' ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test-windows:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify code formatting
        run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic

      - name: Vulnerability & dependency security audit
        run: dotnet list package --vulnerable --include-transitive

      - name: Build solution (Release)
        run: dotnet build --no-restore -c Release

      - name: Package Windows x64 distribution
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Run all tests
        run: dotnet test --no-build -c Release --verbosity normal --logger "trx;LogFileName=test_results.trx"

  build-and-test-linux:
    name: Core, CLI & Protocol Integrity (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build full core solution
        run: dotnet build --no-restore -c Release

      - name: Run all tests including transient SSH protocol tests
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test_results.trx"
