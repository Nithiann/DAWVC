name: GUI WP3 spikes (experimental)
on:
  workflow_dispatch:
  push:
    branches: [spike/gui-wp3-framework-comparison, feat/gui-wp4-avalonia-shell]
    paths: ['spikes/gui/**', 'src/DawVcs.Infrastructure/Repositories/SqliteStagingIndex.cs', 'Directory.Packages.props', '.github/workflows/gui-spikes.yml']
  pull_request:
    branches: [feat_GUI, feat/gui-wp2-operation-errors, spike/gui-wp3-framework-comparison]
    paths: ['spikes/gui/**', 'src/DawVcs.Infrastructure/Repositories/SqliteStagingIndex.cs', 'Directory.Packages.props', '.github/workflows/gui-spikes.yml']
permissions:
  contents: read
jobs:
  windows-spikes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build isolated spikes
        run: dotnet build spikes/gui/GuiSpikes.slnx -c Release
      - name: Shared and headless UI tests
        run: dotnet test spikes/gui/Tests/Tests.csproj -c Release --no-build --logger trx
      - name: Create disposable fixture and exercise real backend
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "wp3-$([guid]::NewGuid().ToString('N'))"
          dotnet run --project spikes/gui/Harness/Harness.csproj -c Release --no-build -- --fixture $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Fixture failed' }
          dotnet run --project spikes/gui/Harness/Harness.csproj -c Release --no-build -- --backend $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Backend smoke failed' }
      - name: Publish twice and compare hashes
        shell: pwsh
        run: ./spikes/gui/publish.ps1
      - name: Native window open/close smoke (not performance acceptance)
        shell: pwsh
        run: ./spikes/gui/smoke-windows.ps1 -PublishRoot ./artifacts/gui-spikes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-wp3-windows-experimental
          path: |
            artifacts/gui-spikes
            spikes/gui/Tests/TestResults
